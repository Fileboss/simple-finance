# Dev local uniquement : le déploiement vit dans un dépôt d'infrastructure séparé.
# Le conteneur tourne en uid 1000 : ./data doit lui être accessible en écriture.
services:
  simple-finance:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Pas de HTTPS en local : cookie de session sans Secure.
      INSECURE_COOKIE: "1"
    volumes:
      - ./data:/data
